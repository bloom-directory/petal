schema = "bloom.petal.build.v1"
name = "{{petal-name}}"
routes = "route/files"
output = "petal/{{petal-name}}"

[route_crate]
package = "{{crate-name}}-route"
path = "route"
alias = "example_route"

# An exact pin. It must match the bloom-petal-sdk dependency in
# route/Cargo.toml and its lockfile; petal build, check and package refuse a
# mismatch.
[sdk]
package = "bloom-petal-sdk"
version = "=0.1.0"

[dependencies]
serde_json = "1"

