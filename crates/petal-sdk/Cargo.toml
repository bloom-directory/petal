[package]
name = "bloom-petal-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for authoring Bloom Petal route components"

[lib]
name = "petal"

[features]
default = []
host-error-detail = []
evm = ["dep:alloy-dyn-abi", "dep:alloy-primitives"]

[dependencies]
bloom-petal-contract = { path = "../.." }
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_jcs = "0.2"
sha2.workspace = true
wit-bindgen.workspace = true

alloy-dyn-abi = { version = "1.6", features = ["eip712"], optional = true }
alloy-primitives = { version = "1.6", optional = true }
