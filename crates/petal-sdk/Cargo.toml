[package]
name = "bloom-petal-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for authoring Bloom Petal route components"

[lib]
name = "petal"

[[example]]
name = "reviewed_message"
required-features = ["evm-messages"]

[features]
evm-messages = ["dep:alloy-dyn-abi", "dep:alloy-primitives"]

[dependencies]
alloy-dyn-abi = { version = "1.7.3", default-features = false, features = ["eip712"], optional = true }
alloy-primitives = { version = "1.7.3", default-features = false, optional = true }
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_jcs = "0.2"
sha2.workspace = true
wit-bindgen.workspace = true
