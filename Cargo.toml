[package]
name = "bloom-petal-contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/bloom-directory/petal"
description = "Canonical Bloom Petal component contract and WIT artifacts"
include = [
  "src/**",
  "wit/**",
  "templates/**",
  "templates/rust-route-petal/route/Cargo.toml.template",
  "templates/rust-route-petal/route/src/**",
  "templates/rust-route-petal/route/files/**",
  "README.md",
  "LICENSE",
]

[workspace]
members = [
  ".",
  "crates/petal-sdk",
  "crates/petal-builder",
  "crates/petal-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/bloom-directory/petal"

[workspace.dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
getrandom = { version = "0.2", features = ["custom"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
toml = "0.8"
url = "2"
wasmparser = "0.221"
wit-bindgen = "=0.57.1"

[dependencies]
blake3.workspace = true
hex.workspace = true
serde.workspace = true
serde_jcs.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
url.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
