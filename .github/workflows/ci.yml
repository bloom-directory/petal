name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      machine_ref:
        description: Full Machine commit whose compatibility manifest selects Broker
        required: true
        type: string
      authorize:
        description: Also exercise actual disposable installer and signing authority
        required: false
        default: false
        type: boolean
      signer_ref:
        description: Full reviewed Signer commit required for authorization mode
        required: false
        type: string

jobs:
  supported-component-boundary:
    name: Compiled SDK component and actual host readers
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk
    env:
      MACHINE_REF: ${{ inputs.machine_ref }}
      SIGNER_REF: ${{ inputs.signer_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: sdk
          persist-credentials: false
      - name: Require an immutable Machine input
        shell: bash
        run: '[[ "$MACHINE_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          repository: bloom-directory/bloom
          ref: ${{ inputs.machine_ref }}
          path: machine
          persist-credentials: false
      - name: Read Broker from the Machine compatibility manifest
        id: broker
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          manifest = pathlib.Path('../machine/packaging/triad/release/compatibility-v1.toml')
          revision = tomllib.loads(manifest.read_text())['revisions']['broker_commit']
          assert re.fullmatch('[0-9a-f]{40}', revision), 'Expected a full Broker commit'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={revision}\n')
          PY
      - uses: actions/checkout@v7
        with:
          repository: bloom-directory/bloom-broker
          ref: ${{ steps.broker.outputs.revision }}
          path: broker
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Require an immutable Signer input for authorization
        if: inputs.authorize
        shell: bash
        run: '[[ "$SIGNER_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v7
        if: inputs.authorize
        with:
          repository: bloom-directory/bloom-signer
          ref: ${{ inputs.signer_ref }}
          path: signer
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk -> target
      - run: scripts/install-tools.sh --wasm-tools-only
      - name: Prepare disposable Linux service manager
        if: inputs.authorize
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Build selected developer authority services
        if: inputs.authorize
        run: |
          cargo build --locked --manifest-path ../broker/Cargo.toml -p bloom-broker -p bloom-broker-debug-driver --features bloom-broker/triad-dev-harness
          cargo build --locked --manifest-path ../signer/Cargo.toml -p bloom-signer --features triad-dev-harness
          cargo build --locked --manifest-path ../machine/Cargo.toml -p bloom --no-default-features --features mount,triad-dev-harness
      - name: Validate, forward and independently decode the public examples
        env:
          AUTHORIZE: ${{ inputs.authorize }}
          BLOOM_INTEGRATION_MACHINE_BIN: ${{ github.workspace }}/machine/target/debug/bloom
          BLOOM_INTEGRATION_BROKER_BIN: ${{ github.workspace }}/broker/target/debug/bloom-broker
          BLOOM_INTEGRATION_DEBUG_DRIVER_BIN: ${{ github.workspace }}/broker/target/debug/bloom-broker-debug-driver
          BLOOM_INTEGRATION_SIGNER_BIN: ${{ github.workspace }}/signer/target/debug/bloom-signer
        run: |
          mode=decode
          if [ "$AUTHORIZE" = true ]; then mode=--authorize; fi
          sh scripts/check-component-message.sh "$GITHUB_WORKSPACE/machine" \
            "$GITHUB_WORKSPACE/broker" 0x0000000000000000000000000000000000000001 "$mode"
      - name: Retain bounded public fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supported-component-boundary
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/petal-component.*/component-result.json
            ${{ runner.temp }}/petal-component.*/machine-test.log
            ${{ runner.temp }}/petal-decoder.*/decoder-test.log

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install component tools
        run: scripts/install-tools.sh
      - run: scripts/check.sh

  first-party-consumers:
    name: First-party consumer (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin reviewed source revisions for Bloom's first-party consumers.
          # Bloom's release catalog advances separately after package publication.
          - name: polymarket
            repository: bloom-directory/bloom-petal-polymarket
            ref: c057e6d82f06626e2143213a9dc0c057e4812f89
          - name: hyperliquid
            repository: bloom-directory/bloom-petal-hyperliquid
            ref: f19e1b10ab2dbeb145704e76b1189bb257622c60
          - name: near-intents
            repository: bloom-directory/bloom-petal-near
            ref: ccabb93214f1f18cf9b36946425e60035763f193
    steps:
      - name: Checkout Petal
        uses: actions/checkout@v7
        with:
          path: petal
      - name: Checkout ${{ matrix.name }}
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: well-known-petal
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install component tools
        run: petal/scripts/install-tools.sh --wasm-tools-only
      - name: Build Petal CLI from this checkout
        run: cargo build --manifest-path petal/Cargo.toml --locked -p bloom-petal-cli
      - name: Use this checkout's SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p well-known-petal/.cargo
          cat > well-known-petal/.cargo/config.toml <<EOF
          [patch."https://github.com/bloom-directory/petal"]
          bloom-petal-sdk = { path = "$GITHUB_WORKSPACE/petal/crates/petal-sdk" }
          EOF
      - name: Test route crate against this checkout
        working-directory: well-known-petal
        run: cargo test --manifest-path route/Cargo.toml
      - name: Build and check route components against this checkout
        working-directory: well-known-petal
        shell: bash
        run: |
          set -euo pipefail
          petal_bin="$GITHUB_WORKSPACE/petal/target/debug/petal"
          PETAL_BIN="$petal_bin" scripts/build.sh
          "$petal_bin" check --root .
          sdk_manifest="$GITHUB_WORKSPACE/petal/crates/petal-sdk/Cargo.toml"
          cargo metadata \
            --manifest-path target/petal-routes/workspace/Cargo.toml \
            --format-version 1 \
            | jq -e --arg sdk "$sdk_manifest" \
              'any(.packages[]; .name == "bloom-petal-sdk" and .manifest_path == $sdk)'
