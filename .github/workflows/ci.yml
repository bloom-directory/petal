name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install component tools
        run: |
          cargo install wasm-tools --version 1.249.0 --locked
          cargo install wit-bindgen-cli --version 0.57.1 --locked
      - run: scripts/check.sh

  well-known-petals:
    name: Well-known Petal (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin reviewed source revisions that compile against this checkout.
          # Bloom's release catalog advances separately after package publication.
          - name: polymarket
            repository: bloom-directory/bloom-petal-polymarket
            ref: 8b2a5f69af86d822654143a31aa54f518955e616
          - name: near-intents
            repository: bloom-directory/bloom-petal-near
            ref: 6acfa383c3b81f136313884426f1641afe144bd3
          - name: enso
            repository: bloom-directory/bloom-petal-enso
            ref: 4f1573af94d4155a44439354bca3ccbec6ae5fc8
    steps:
      - name: Checkout Petal
        uses: actions/checkout@v4
        with:
          path: petal
      - name: Checkout ${{ matrix.name }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: well-known-petal
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install component tools
        run: cargo install wasm-tools --version 1.249.0 --locked
      - name: Build Petal CLI from this checkout
        run: cargo build --manifest-path petal/Cargo.toml --locked -p bloom-petal-cli
      - name: Use this checkout's SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p well-known-petal/.cargo
          cat > well-known-petal/.cargo/config.toml <<EOF
          [patch."https://github.com/bloom-directory/petal"]
          bloom-petal-sdk = { path = "$GITHUB_WORKSPACE/petal/crates/petal-sdk" }
          EOF
      - name: Test route crate against this checkout
        working-directory: well-known-petal
        run: cargo test --manifest-path route/Cargo.toml
      - name: Build and check route components against this checkout
        working-directory: well-known-petal
        shell: bash
        run: |
          set -euo pipefail
          petal_bin="$GITHUB_WORKSPACE/petal/target/debug/petal"
          PETAL_BIN="$petal_bin" scripts/build.sh
          "$petal_bin" check --root .
          sdk_manifest="$GITHUB_WORKSPACE/petal/crates/petal-sdk/Cargo.toml"
          cargo metadata \
            --manifest-path target/petal-routes/workspace/Cargo.toml \
            --format-version 1 \
            | jq -e --arg sdk "$sdk_manifest" \
              'any(.packages[]; .name == "bloom-petal-sdk" and .manifest_path == $sdk)'
