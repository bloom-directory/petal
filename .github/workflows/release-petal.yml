name: Release Petal

on:
  workflow_call:
    inputs:
      petal-name:
        description: Petal package name from petal.toml.
        required: true
        type: string
      petal-tooling-ref:
        description: >-
          Exact 40-character bloom-directory/petal commit whose CLI builds and
          packages the release. Defaults to the SDK commit the route
          workspace's Cargo.lock pins, so the SDK pin is the only version a
          Petal names. Set it while the SDK pin predates 0.2.0: older CLIs
          lack `petal package --no-build`, which this workflow runs.
        default: ""
        required: false
        type: string
      build-command:
        description: Command that builds the caller's route components.
        default: scripts/build.sh
        required: false
        type: string
      package-root:
        description: Package root containing petal.toml, README.md, and AGENTS.md.
        default: .
        required: false
        type: string
      expected-route-count:
        description: Optional exact route count asserted after packaging.
        default: 0
        required: false
        type: number
    secrets:
      compile-time-secret:
        description: Optional secret exposed as PETAL_COMPILE_TIME_SECRET during compilation.
        required: false

permissions: {}

concurrency:
  group: petal-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish ${{ inputs['petal-name'] }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate immutable release inputs
        env:
          PETAL_NAME: ${{ inputs['petal-name'] }}
          PETAL_TOOLING_REF: ${{ inputs['petal-tooling-ref'] }}
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::Petal releases must run from a tag, got ref type: $REF_TYPE"
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag must be a semantic version beginning with v, got: $RELEASE_TAG"
            exit 1
          fi
          if [[ -n "$PETAL_TOOLING_REF" && ! "$PETAL_TOOLING_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::petal-tooling-ref must be an exact lowercase 40-character commit"
            exit 1
          fi
          if [[ ! "$PETAL_NAME" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::petal-name contains unsupported characters: $PETAL_NAME"
            exit 1
          fi

      - name: Check out Petal source at the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag resolves to the checked-out commit
        id: source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
            echo "::error::tag and checkout commits differ ($TAG_SHA, $HEAD_SHA)"
            exit 1
          fi
          echo "source_commit=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Install Rust WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The CLI comes from the SDK commit the route workspace's lockfile pins,
      # unless the caller names one. The builder refuses an SDK of another
      # version either way.
      - name: Resolve the Petal tooling commit
        id: tooling
        env:
          PACKAGE_ROOT: ${{ inputs['package-root'] }}
          PETAL_TOOLING_REF: ${{ inputs['petal-tooling-ref'] }}
        run: |
          set -euo pipefail
          # The one bloom-directory/petal commit, and tag if any, that the
          # route lockfile records for every crate from that repository.
          LOCK="$(python3 - "$PACKAGE_ROOT" <<'PY'
          import json, pathlib, re, subprocess, sys, tomllib
          from urllib.parse import parse_qsl
          def repository(url):
              # Any spelling that reaches the repository, including those the
              # builder accepts: scheme, user, case, ".git", trailing "/".
              url = re.sub(r"^[a-z][a-z0-9+.-]*://([^/@]*@)?", "", url.strip(), flags=re.I)
              return url.lower().rstrip("/").removesuffix(".git").rstrip("/")
          root = pathlib.Path(sys.argv[1])
          config = tomllib.loads((root / "petal-build.toml").read_text())
          crate = root / config["route_crate"]["path"] / "Cargo.toml"
          workspace = json.loads(subprocess.check_output(
              ["cargo", "locate-project", "--workspace", "--manifest-path", str(crate)]
          ))["root"]
          lock = pathlib.Path(workspace).parent / "Cargo.lock"
          package = config.get("sdk", {}).get("package", "bloom-petal-sdk")
          entries = tomllib.loads(lock.read_text()).get("package", [])
          pins, names, unpinned = set(), set(), set()
          for entry in entries:
              found = re.fullmatch(r"git\+([^?#]*)(?:\?([^#]*))?(?:#(.*))?", entry.get("source", ""))
              if not found or repository(found.group(1)) != "github.com/bloom-directory/petal":
                  continue
              name = entry.get("name", "")
              name = name if re.fullmatch(r"[A-Za-z0-9_-]+", name) else "a crate"
              names.add(name)
              query = dict(parse_qsl(found.group(2) or "", keep_blank_values=True))
              commit, tag = (found.group(3) or "").lower(), query.get("tag", "")
              if (
                  len(query) != 1
                  or not set(query) <= {"rev", "tag"}
                  or not re.fullmatch(r"[0-9a-f]{40}", commit)
                  or (tag and not re.fullmatch(r"v[0-9][0-9A-Za-z.+-]*", tag))
              ):
                  unpinned.add(name)
              pins.add((commit, tag))
          sdk_sources = [entry.get("source", "") for entry in entries if entry.get("name") == package]
          error = ""
          if unpinned:
              error = f"the route lockfile takes {', '.join(sorted(unpinned))} from bloom-directory/petal without a full commit and a rev or release tag"
          elif len(pins) > 1:
              error = f"the route lockfile records {', '.join(sorted(names))} from bloom-directory/petal at more than one commit or tag, and Cargo builds all of them from one"
          commit, tag = next(iter(pins)) if len(pins) == 1 else ("", "")
          print(json.dumps({
              "commit": commit,
              "tag": tag,
              # The SDK itself is taken from that commit, alone.
              "sdk": len(sdk_sources) == 1 and package in names,
              "error": error,
          }))
          PY
          )"
          LOCK_ERROR="$(jq -r '.error' <<<"$LOCK")"
          if [[ -n "$LOCK_ERROR" ]]; then
            echo "::error::$LOCK_ERROR"
            exit 1
          fi
          LOCKED="$(jq -r '.commit' <<<"$LOCK")"
          LOCKED_TAG="$(jq -r '.tag' <<<"$LOCK")"
          if [[ -z "$PETAL_TOOLING_REF" ]]; then
            if [[ "$(jq -r '.sdk' <<<"$LOCK")" != true ]]; then
              echo "::error::the route lockfile does not pin the SDK to one bloom-directory/petal commit; pin a release tag or set petal-tooling-ref"
              exit 1
            fi
            PETAL_TOOLING_REF="$LOCKED"
          elif [[ -n "$LOCKED" && "$LOCKED" != "$PETAL_TOOLING_REF" ]]; then
            echo "::warning::petal-tooling-ref $PETAL_TOOLING_REF differs from the bloom-directory/petal commit $LOCKED the lockfile pins; from SDK 0.2.0 on, omit it to build with the SDK's own CLI"
          fi

          # GitHub serves a commit from any fork of bloom-directory/petal at its
          # URL. Take only commits on master or a release tag (v and a number),
          # and for a tag pin, only the commit the tag names. Every crate the
          # lockfile takes from the repository is checked above to share the
          # commit checked here. A full fetch, not a partial clone, which would
          # fetch a missing commit on demand.
          REFS="$RUNNER_TEMP/petal-refs.git"
          git init --quiet --bare "$REFS"
          git -C "$REFS" fetch --quiet --no-tags https://github.com/bloom-directory/petal \
            '+refs/heads/master:refs/heads/master' '+refs/tags/v*:refs/tags/v*'
          reviewed() {
            git -C "$REFS" merge-base --is-ancestor "$1" master 2>/dev/null ||
              [[ -n "$(git -C "$REFS" for-each-ref --contains "$1" 'refs/tags/v[0-9]*' 2>/dev/null)" ]]
          }
          if [[ -n "$LOCKED_TAG" ]]; then
            TAGGED="$(git -C "$REFS" rev-parse --verify --quiet "refs/tags/$LOCKED_TAG^{commit}" || true)"
            if [[ "$TAGGED" != "$LOCKED" ]]; then
              echo "::error::the route lockfile pins tag $LOCKED_TAG of bloom-directory/petal at $LOCKED, but $LOCKED_TAG names ${TAGGED:-no commit}; refresh the lockfile: cargo update -p bloom-petal-sdk"
              exit 1
            fi
          elif [[ -n "$LOCKED" ]] && ! reviewed "$LOCKED"; then
            echo "::error::the route lockfile pins bloom-directory/petal commit $LOCKED, which is not on its master or a release tag"
            exit 1
          fi
          if ! reviewed "$PETAL_TOOLING_REF"; then
            echo "::error::Petal tooling commit $PETAL_TOOLING_REF is not on bloom-directory/petal's master or a release tag"
            exit 1
          fi
          echo "commit=$PETAL_TOOLING_REF" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Petal tooling
        uses: actions/checkout@v7
        with:
          repository: bloom-directory/petal
          ref: ${{ steps.tooling.outputs.commit }}
          path: .petal-tooling
          persist-credentials: false

      # Cargo and rustup read configuration and toolchain files from the
      # working directory and its parents. Build the tooling outside the Petal
      # checkout, so the Petal's own Cargo config or rust-toolchain file cannot
      # change the CLI that checks it, or the WASM tools it builds with.
      - name: Move Petal tooling out of the Petal checkout
        run: mv .petal-tooling "$RUNNER_TEMP/petal-tooling"

      - name: Install pinned WASM component tools
        working-directory: ${{ runner.temp }}/petal-tooling
        run: scripts/install-tools.sh --wasm-tools-only

      - name: Build pinned Petal CLI
        working-directory: ${{ runner.temp }}/petal-tooling
        run: |
          set -euo pipefail
          cargo build --locked --release -p bloom-petal-cli
          cp target/release/petal "$RUNNER_TEMP/petal"

      - name: Build route components with pinned Petal CLI
        env:
          BUILD_COMMAND: ${{ inputs['build-command'] }}
          PETAL_COMPILE_TIME_SECRET: ${{ secrets['compile-time-secret'] }}
          PETAL_BIN: ${{ runner.temp }}/petal
          # Refuse the checkout's Cargo config, and any package Cargo would read
          # from somewhere the tested lockfile does not name.
          PETAL_REQUIRE_LOCKED_SOURCES: "1"
        run: bash -euo pipefail -c "$BUILD_COMMAND"

      - name: Package deterministic release archive
        id: package
        env:
          EXPECTED_ROUTE_COUNT: ${{ inputs['expected-route-count'] }}
          PACKAGE_ROOT: ${{ inputs['package-root'] }}
          PETAL_NAME: ${{ inputs['petal-name'] }}
          PETAL_REQUIRE_LOCKED_SOURCES: "1"
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ARCHIVE="$PETAL_NAME-$RELEASE_TAG.petal.tar.gz"
          mkdir -p dist
          # Package exactly what the build command produced. A rebuild here
          # would not see PETAL_COMPILE_TIME_SECRET or the values the build
          # command derives from it, and would ship components without them.
          "$RUNNER_TEMP/petal" package \
            --no-build \
            --root "$PACKAGE_ROOT" \
            --out "$RUNNER_TEMP/$ARCHIVE" \
            > "$RUNNER_TEMP/package-report.json"
          ROUTES="$(jq -er '.routes' "$RUNNER_TEMP/package-report.json")"
          if [[ "$EXPECTED_ROUTE_COUNT" -gt 0 && "$ROUTES" -ne "$EXPECTED_ROUTE_COUNT" ]]; then
            echo "::error::expected $EXPECTED_ROUTE_COUNT routes, packaged $ROUTES"
            exit 1
          fi
          mv "$RUNNER_TEMP/$ARCHIVE" "dist/$ARCHIVE"
          {
            echo "archive=$ARCHIVE"
            echo "archive_sha256=$(jq -er '.sha256' "$RUNNER_TEMP/package-report.json")"
            echo "package_hash=$(jq -er '.package_hash' "$RUNNER_TEMP/package-report.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Write checksums and release provenance
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.package.outputs.archive_sha256 }}
          PACKAGE_HASH: ${{ steps.package.outputs.package_hash }}
          PETAL_NAME: ${{ inputs['petal-name'] }}
          PETAL_TOOLING_REF: ${{ steps.tooling.outputs.commit }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$ARCHIVE" > dist/SHA256SUMS
          jq -n \
            --arg schema 'bloom.petal.release.v1' \
            --arg petal_name "$PETAL_NAME" \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg release_tag "$RELEASE_TAG" \
            --arg archive "$ARCHIVE" \
            --arg archive_sha256 "$ARCHIVE_SHA256" \
            --arg package_hash "$PACKAGE_HASH" \
            --arg tooling_repository 'bloom-directory/petal' \
            --arg tooling_commit "$PETAL_TOOLING_REF" \
            '{
              schema: $schema,
              petal_name: $petal_name,
              source_repository: $source_repository,
              source_commit: $source_commit,
              release_tag: $release_tag,
              archive: $archive,
              archive_sha256: $archive_sha256,
              package_hash: $package_hash,
              tooling_repository: $tooling_repository,
              tooling_commit: $tooling_commit
            }' > dist/petal-release.json
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Refuse to replace published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            EXISTING="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
            for asset in "$ARCHIVE" SHA256SUMS petal-release.json; do
              if grep -Fxq "$asset" <<<"$EXISTING"; then
                echo "::error::release $RELEASE_TAG already contains $asset; immutable assets are never overwritten"
                exit 1
              fi
            done
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "dist/$ARCHIVE" \
            dist/SHA256SUMS \
            dist/petal-release.json
